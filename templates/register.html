{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block main %}
<div class="auth-page">
    <!-- LEFT SIDE (same structure as login) -->
    <div class="auth-left">
        <div class="auth-image-wrapper">
            <img
                src="/static/images/auth-books3.jpg"
                alt="Books"
                class="auth-image"
            >
        </div>

        <h1>Create your <span class="brand">BookNest</span></h1>
        <p>
            Build your own reading corner.
            Rate books, write reviews, and keep
            track of everything you read.
        </p>

    </div>

    <!-- RIGHT SIDE (card, same as login) -->
    <div class="auth-card">
        <h2>Create Account</h2>

        <form method="post">
            <input
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                name="confirmation"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">Register</button>
        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="/login">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
