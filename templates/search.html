{% extends "layout.html" %}

{% block title %}Search{% endblock %}

{% block main %}
<h1>Search Books</h1>

<form method="post">
    <input name="query" placeholder="Title, Author, or ISBN" required>
    <button type="submit">Search</button>
</form>

{% if results %}
    <h2>Results for "{{ query }}"</h2>
    <ul>
        {% for book in results %}
            <div class="book-card">
                <img
                    src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg"
                    alt="Book cover"
                    onerror="this.style.display='none'"
                >

                <div>
                    <a href="/book/{{ book.isbn }}">
                        <strong>{{ book.title }}</strong>
                    </a>
                    <p>{{ book.author }}</p>
                </div>
            </div>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
