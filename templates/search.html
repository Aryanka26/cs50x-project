{% extends "layout.html" %}

{% block title %}Search{% endblock %}

{% block main %}
<h1>Search Books</h1>

<form method="post">
    <input name="query" placeholder="Title, Author, or ISBN" required>
    <button type="submit">Search</button>
</form>

{% if results %}
    <h2>Results for "{{ query }}"</h2>
    <ul>
        {% for book in results %}
            <li>
                <a href="/book/{{ book.isbn }}">{{ book.title }}</a> by {{ book.author }} ({{ book.year }})
            </li>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
