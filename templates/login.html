{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block main %}
<div class="auth-page">
    <div class="auth-left">
        <div class="auth-image-wrapper">
            <img
                src="/static/images/auth-books2.png"
                alt="Books"
                class="auth-image"
            >
        </div>

        <h1>Welcome Back</h1>
        <p>
            Track your reading journey, review books,
            and discover your next favorite read.
        </p>
    </div>



    <div class="auth-card">
        <h2>Login</h2>

        <form action="/login" method="post">
            <input name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Log In</button>
        </form>

        <p class="auth-switch">
            New here?
            <a href="/register">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
